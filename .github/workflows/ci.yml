# Runs the test levels of docs/08-testing.md on every push and pull request.
# The AI provider is the MockProvider, so no API key is needed. The PocketBase superuser below is a
# throwaway account that exists only inside the CI container.
name: CI

on:
  push:
  pull_request:

env:
  PB_SUPERUSER_EMAIL: ci@classpulse.test
  PB_SUPERUSER_PASSWORD: ci-only-password-123
  LLM_PROVIDER: mock

jobs:
  check:
    name: Typecheck, unit tests, coverage, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck -w apps/api && npx tsc -b apps/web
      - name: Unit and HTTP tests with coverage (NFR-07, ≥80% lines)
        run: npm run coverage -w apps/api
      - name: Build
        run: npm run build

  integration:
    name: Integration tests (real PocketBase)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Write the CI .env
        run: printf 'PB_SUPERUSER_EMAIL=%s\nPB_SUPERUSER_PASSWORD=%s\nLLM_PROVIDER=mock\n' "$PB_SUPERUSER_EMAIL" "$PB_SUPERUSER_PASSWORD" > .env
      - name: Start PocketBase (applies the migrations)
        run: |
          docker compose up -d pocketbase
          timeout 60 sh -c 'until curl -sf http://127.0.0.1:8090/api/health; do sleep 1; done'
          docker compose exec -T pocketbase /usr/local/bin/pocketbase superuser upsert "$PB_SUPERUSER_EMAIL" "$PB_SUPERUSER_PASSWORD" --dir=/pb_data
      - run: npm run test:int -w apps/api

  e2e:
    name: Browser E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Write the CI .env
        run: printf 'PB_SUPERUSER_EMAIL=%s\nPB_SUPERUSER_PASSWORD=%s\nLLM_PROVIDER=mock\n' "$PB_SUPERUSER_EMAIL" "$PB_SUPERUSER_PASSWORD" > .env
      - name: Start PocketBase (applies the migrations)
        run: |
          docker compose up -d pocketbase
          timeout 60 sh -c 'until curl -sf http://127.0.0.1:8090/api/health; do sleep 1; done'
          docker compose exec -T pocketbase /usr/local/bin/pocketbase superuser upsert "$PB_SUPERUSER_EMAIL" "$PB_SUPERUSER_PASSWORD" --dir=/pb_data
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit
      - run: npm run e2e
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
