# /        static PWA (SPA fallback)
# /api/    Hono API (prefix stripped, same as the Vite dev proxy)
# /pb/     PocketBase (prefix stripped). Realtime is SSE, so no buffering and long reads.
# $request_time = server-side latency; the load test reads it (loadtest/run.sh).
log_format timed '$time_iso8601 $request_method $uri $status $request_time';

server {
  listen 80;
  access_log /var/log/nginx/access.log timed;
  root /usr/share/nginx/html;
  client_max_body_size 60m;   # recordings arrive in 50 MB chunks (Cloudflare caps a request at 100 MB)

  location /api/ {
    proxy_pass http://api:8787/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
  }

  # Admin UI and superuser auth only through an SSH tunnel: requests that came through Cloudflare carry CF-Connecting-IP.
  # PocketBase also resolves the collection by id (pbc_3142635823) and by name case-insensitively.
  location ~* ^/pb/(_/|api/collections/(_superusers|pbc_3142635823)(/|$)) {
    if ($http_cf_connecting_ip) { return 404; }
    rewrite ^/pb/(.*)$ /$1 break;
    proxy_pass http://pocketbase:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /pb/ {
    proxy_pass http://pocketbase:8090/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
